name: Course CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-quality:
    name: Course quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install the pinned Python version
        run: uv python install

      - name: Reproduce the locked environment
        run: uv sync --locked

      - name: Prepare package and notebook kernel
        run: uv run python scripts/setup_course.py

      - name: Check Python style
        run: uv run ruff check src tests scripts

      - name: Build the Python distribution
        run: uv build

      - name: Run package, environment, and notebook tests
        run: uv run pytest -q

  ci-gate:
    name: CI gate
    if: always()
    needs: course-quality
    runs-on: ubuntu-latest
    steps:
      - name: Require every operating system to pass
        env:
          MATRIX_RESULT: ${{ needs.course-quality.result }}
        run: test "$MATRIX_RESULT" = "success"
