name: Course CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  course-quality:
    name: Course quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install the pinned Python version
        run: uv python install

      - name: Reproduce the locked environment
        run: uv sync --locked

      - name: Prepare package and notebook kernel
        run: uv run python scripts/setup_course.py

      - name: Check Python style
        run: uv run ruff check src tests scripts

      - name: Build the Python distribution
        run: uv build

      - name: Run package, environment, and notebook tests
        run: uv run pytest -q

      - name: Upload the Python distribution
        if: matrix.os == 'ubuntu-latest' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rice-dsm-python-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs: course-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every operating system to pass
        env:
          MATRIX_RESULT: ${{ needs.course-quality.result }}
        run: test "$MATRIX_RESULT" = "success"
