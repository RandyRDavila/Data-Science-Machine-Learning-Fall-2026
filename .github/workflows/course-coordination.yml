name: Course Contribution Coordination

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: course-coordination-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claim-or-release:
    name: Process an explicit task command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/claim' || github.event.comment.body == '/release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      # issue_comment is privileged. Execute only the reviewed default-branch
      # coordinator; never check out or evaluate comment-authored code.
      - name: Check out trusted coordination code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assign or release the commenting participant
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/course_coordination.py handle-comment

  request-peer-review:
    name: Request balanced peer reviews
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      # pull_request_target has a write token. The explicit default-branch ref
      # is a security boundary: do not replace it with a PR head or merge ref.
      - name: Check out trusted coordination code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select and request eligible peer reviewers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/course_coordination.py assign-reviewers
